name: Publish Oracle image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/danysers/vamosalsantisimo-pablomartinez:latest
            ghcr.io/danysers/vamosalsantisimo-pablomartinez:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy the completed image to Dokploy
        env:
          DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          test -n "$DEPLOY_WEBHOOK"
          curl --fail --silent --show-error --max-time 30 \
            -H 'Content-Type: application/json' \
            -H 'x-github-event: registry_package' \
            --data '{"registry_package":{"package_version":{"package_url":"ghcr.io/danysers/vamosalsantisimo-pablomartinez:latest","container_metadata":{"tag":{"name":"latest"}}}}}' \
            "$DEPLOY_WEBHOOK"
