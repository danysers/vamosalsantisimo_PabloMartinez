name: Publish Oracle image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-main
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
  publish:
    needs: verify
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/danysers/vamosalsantisimo-pablomartinez:latest
            ghcr.io/danysers/vamosalsantisimo-pablomartinez:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Dokploy's private release watcher deploys a changed GHCR digest after
      # publication. GitHub runners do not need credentials for the control plane.
