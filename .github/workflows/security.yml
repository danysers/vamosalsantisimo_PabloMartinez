name: Security regression checks
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
        env:
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:disposable-ci-only@localhost:5432/postgres
      RUN_GROUP_WORKFLOW_DB_TEST: '1'
      RUN_PAYMENT_PROOF_DB_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - run: npm install --global pnpm@11.27.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      # Both installed development versions disable extglobs via pnpm patches.
      # The registry audit reports the underlying upstream versions.
      - run: node scripts/check-lint-globs.mjs
      - run: pnpm audit --dev --ignore GHSA-fc5q-39xc-vjpf
      - run: pnpm typecheck && pnpm lint
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r automation/flyers/requirements.txt
      - run: python -m unittest discover -s automation/flyers -p 'test_*.py'
      - run: node scripts/migrate.mjs && node scripts/seed-workshop.mjs
      - run: pnpm test
