# Native binaries used by the pinned build/lint tooling; no other dependency
# lifecycle scripts are approved for this local site.
allowBuilds:
  esbuild: true
  unrs-resolver: true

# Remove the vulnerable optional CLI transitive version (GHSA-67mh-4wv8-2f99).
overrides:
  'esbuild@<0.25.0': '0.25.12'
